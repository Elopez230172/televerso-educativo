name: Instalar navegación curricular
on:
  push:
    paths:
      - 'navegacion-curricular.js'
      - '.github/workflows/install-navegacion-curricular.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript
        run: node --check navegacion-curricular.js
      - name: Insertar módulo curricular
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='    <script src="navegacion-curricular.js"></script>\n'
          anchor='    <script src="acceso-por-grado.js"></script>\n'
          if tag not in s:
              if anchor not in s:
                  raise SystemExit('No se encontró acceso-por-grado.js en index.html')
              s=s.replace(anchor, anchor+tag, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Publicar cambio
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'televerso-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Integrar navegación por campo, periodo y PPA [skip ci]'
          git push