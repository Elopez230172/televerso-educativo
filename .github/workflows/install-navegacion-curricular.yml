name: Instalar navegación curricular
on:
  push:
    paths:
      - 'navegacion-curricular.js'
      - 'navegacion-progresiva.js'
      - 'modo-retos.js'
      - 'saberes2-retos-directos.js'
      - '.github/workflows/install-navegacion-curricular.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript
        run: |
          node --check navegacion-curricular.js
          node --check navegacion-progresiva.js
          node --check modo-retos.js
          node --check saberes2-retos-directos.js
      - name: Insertar módulos de interfaz
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          nav='    <script src="navegacion-curricular.js"></script>\n'
          nav_anchor='    <script src="acceso-por-grado.js"></script>\n'
          if nav not in s:
              if nav_anchor not in s:
                  raise SystemExit('No se encontró acceso-por-grado.js en index.html')
              s=s.replace(nav_anchor, nav_anchor+nav, 1)

          progressive='    <script src="navegacion-progresiva.js"></script>\n'
          if progressive not in s:
              if nav not in s:
                  raise SystemExit('No se encontró navegacion-curricular.js en index.html')
              s=s.replace(nav, nav+progressive, 1)

          direct='    <script src="modo-retos.js"></script>\n'
          direct_anchor='    <script src="expediente-mejorado.js"></script>\n'
          if direct not in s:
              if direct_anchor not in s:
                  raise SystemExit('No se encontró expediente-mejorado.js en index.html')
              s=s.replace(direct_anchor, direct_anchor+direct, 1)

          sp2='    <script src="saberes2-retos-directos.js"></script>\n'
          if sp2 not in s:
              if direct not in s:
                  raise SystemExit('No se encontró modo-retos.js en index.html')
              s=s.replace(direct, direct+sp2, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Publicar cambio
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'televerso-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Integrar navegación curricular progresiva [skip ci]'
          git push
