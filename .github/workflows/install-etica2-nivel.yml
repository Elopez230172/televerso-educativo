name: Integrar nivel Ética 2
on:
  push:
    paths:
      - 'etica2-nivel-secundaria.js'
      - '.github/workflows/install-etica2-nivel.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript
        run: node --check etica2-nivel-secundaria.js
      - name: Insertar módulo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor='    <script src="etica-segundo.js"></script>\n'
          line='    <script src="etica2-nivel-secundaria.js"></script>\n'
          if line not in s:
              if anchor not in s:
                  raise SystemExit('No se encontró etica-segundo.js en index.html')
              s=s.replace(anchor,anchor+line,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar y retirar instalador
        run: |
          rm .github/workflows/install-etica2-nivel.yml
          git config user.name 'televerso-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/install-etica2-nivel.yml
          git commit -m 'Publicar retos de Ética 2 con nivel de secundaria [skip ci]'
          git push
