name: Integrar Lenguajes de segundo grado en TeleVerso

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-lenguajes-segundo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insertar complemento de segundo grado
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="lenguajes-segundo.js"></script>'
          if tag not in s:
              anchor='<script src="saberes-campo-fix.js"></script>'
              if anchor in s:
                  s=s.replace(anchor, anchor+'\n    '+tag, 1)
              else:
                  s=s.replace('<script src="expediente-mejorado.js"></script>', tag+'\n    <script src="expediente-mejorado.js"></script>',1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/install-lenguajes-segundo.yml
      - name: Publicar integración
        run: |
          git config user.name "televerso-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Lenguajes 2.º ya estaba integrado."
            exit 0
          fi
          git commit -m "Integrar Lenguajes PPA1 de segundo grado [skip ci]"
          git push
