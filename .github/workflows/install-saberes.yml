name: Instalar Saberes PPA1 en TeleVerso

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'saberes-addon.js'
      - 'saberes-nivel-tercero.js'
      - 'saberes-campo-fix.js'
      - '.github/workflows/install-saberes.yml'

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Integrar Saberes en index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          saber = '<script src="saberes-addon.js"></script>'
          level = '<script src="saberes-nivel-tercero.js"></script>'
          fix = '<script src="saberes-campo-fix.js"></script>'
          exp = '<script src="expediente-mejorado.js"></script>'

          if saber not in s:
              anchor = '<script src="lenguajes-avanzado.js"></script>'
              if anchor in s:
                  s = s.replace(anchor, anchor + '\n    ' + saber, 1)
              else:
                  anchor = '<script src="lenguajes-addon.js"></script>'
                  if anchor in s:
                      s = s.replace(anchor, anchor + '\n    ' + saber, 1)
                  else:
                      s = s.replace('</body>', '    ' + saber + '\n</body>', 1)

          # El banco revisado de tercer grado debe ejecutarse después del catálogo base.
          if level not in s:
              if saber in s:
                  s = s.replace(saber, saber + '\n    ' + level, 1)
              else:
                  s = s.replace('</body>', '    ' + level + '\n</body>', 1)

          # La corrección del campo se ejecuta después del banco revisado.
          if fix not in s:
              if level in s:
                  s = s.replace(level, level + '\n    ' + fix, 1)
              elif saber in s:
                  s = s.replace(saber, saber + '\n    ' + fix, 1)
              else:
                  s = s.replace('</body>', '    ' + fix + '\n</body>', 1)

          # Normalizar orden por si alguna versión previa dejó scripts en otra posición.
          for tag in (level, fix, exp):
              s = s.replace('    ' + tag + '\n', '').replace(tag + '\n', '')
          if saber in s:
              s = s.replace(saber, saber + '\n    ' + level + '\n    ' + fix + '\n    ' + exp, 1)
          else:
              s = s.replace('</body>', '    ' + level + '\n    ' + fix + '\n    ' + exp + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Publicar cambios
        run: |
          if git diff --quiet; then
            echo "Saberes PPA1 ya está integrado con nivel de tercer grado."
            exit 0
          fi
          git config user.name "televerso-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Elevar Saberes PPA1 a nivel de tercer grado [skip ci]"
          git push
