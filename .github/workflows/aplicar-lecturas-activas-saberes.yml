name: Aplicar lecturas activas Saberes 2

on:
  push:
    paths:
      - '.github/workflows/aplicar-lecturas-activas-saberes.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrar lecturas activas en Saberes 2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('saberes-segundo.js')
          t=p.read_text(encoding='utf-8')
          t=t.replace('Alineado al cuaderno de Lenguajes 2.º: siete etapas, un proyecto integrado, un producto final y 10 retos.',
                      'Alineado al cuaderno de Lenguajes 2.º: siete etapas, un proyecto integrado, un producto final, 10 retos y lecturas activas.')
          marker='  const prevSetField=window.tvSetField;'
          insert="""  // Lecturas activas: convierten los materiales de consulta en acciones concretas del proyecto.
          Object.assign(missionCatalog.sp2_2,{
            readingSource:'Proyecto pp. 111-115 · Saberes pp. 82-97',
            readingTask:'Antes de la sopa, marca en la lectura D = definición, P = procedimiento, E = ejemplo y ? = duda. Elige tres hallazgos, explícalos con tus palabras y escribe cómo los aplicarás al informe.'
          });
          Object.assign(missionCatalog.sp2_5,{
            readingSource:'Proyecto pp. 116-119 · Saberes pp. 82-97',
            readingTask:'Elige dos afirmaciones o datos de las lecturas. Para cada uno identifica evidencia u origen, contexto que falta y decide: usar, revisar o descartar. Cierra con una paráfrasis científica propia.'
          });
          Object.assign(missionCatalog.sp2_7,{
            readingSource:'Proyecto pp. 120-124 · Saberes pp. 82-97',
            readingTask:'Aplica una lupa de equidad: registra qué personas o grupos aparecen, quiénes podrían faltar, qué dato ayudaría a comprobarlo y qué otra fuente consultarías. Contrasta un dato cuantitativo con un registro cualitativo verificable.'
          });

          const readingBox=m=>m.readingTask?`<div class="rounded-xl bg-cyan-950/30 border border-cyan-500/20 p-3 mb-3"><span class="text-[9px] uppercase tracking-wider text-cyan-300 font-black">Lectura activa previa</span><p class="text-[11px] text-slate-200 mt-1 leading-relaxed">${m.readingTask}</p><p class="text-[10px] text-amber-300 mt-1 font-semibold">${m.readingSource}</p></div>`:'';

          """
          if 'const readingBox=m=>m.readingTask?' not in t:
              if marker not in t: raise SystemExit('No se encontró el punto de inserción')
              t=t.replace(marker,insert+marker,1)
          t=t.replace("['5','Distintas fuentes de consulta','R2-R9: datos, cálculos, gráficas, fuentes y equidad.'],",
                      "['5','Distintas fuentes de consulta','Lecturas activas A, B y C + R2-R9: datos, cálculos, gráficas, fuentes y equidad.'],")
          old='<p class="text-slate-300 text-xs mb-2 leading-relaxed">${m.desc}</p><div class="rounded-xl bg-slate-900/50 border border-white/5 p-2.5 mb-3">'
          new='<p class="text-slate-300 text-xs mb-2 leading-relaxed">${m.desc}</p>${readingBox(m)}<div class="rounded-xl bg-slate-900/50 border border-white/5 p-2.5 mb-3">'
          if '${readingBox(m)}<div class="rounded-xl bg-slate-900/50' not in t:
              if old not in t: raise SystemExit('No se encontró la tarjeta de evidencia')
              t=t.replace(old,new,1)
          oldh='<h3 class="text-xl font-black text-white">${m.icon} ${m.title}</h3><p class="text-slate-300 text-xs">${m.desc}</p><p class="text-[11px] text-slate-400"><b class="text-emerald-300">Evidencia:</b> ${m.evidence}</p>`;'
          newh='<h3 class="text-xl font-black text-white">${m.icon} ${m.title}</h3><p class="text-slate-300 text-xs">${m.desc}</p>${readingBox(m)}<p class="text-[11px] text-slate-400"><b class="text-emerald-300">Evidencia:</b> ${m.evidence}</p>`;'
          if '${readingBox(m)}<p class="text-[11px] text-slate-400"' not in t:
              if oldh not in t: raise SystemExit('No se encontró el encabezado de misión')
              t=t.replace(oldh,newh,1)
          p.write_text(t,encoding='utf-8')
          PY
          node --check saberes-segundo.js

      - name: Confirmar cambio y limpiar instalador
        run: |
          git config user.name "televerso-bot"
          git config user.email "actions@users.noreply.github.com"
          git add saberes-segundo.js
          git rm .github/workflows/aplicar-lecturas-activas-saberes.yml
          git commit -m "Agregar lecturas activas a Saberes 2 [skip ci]"
          git push
