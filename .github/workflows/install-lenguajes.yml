name: Integrar Lenguajes en TeleVerso

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-lenguajes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Incluir complemento de Lenguajes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '    <script src="lenguajes-addon.js"></script>\n'
          if 'src="lenguajes-addon.js"' not in s:
              s = s.replace('</body>', tag + '</body>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Publicar cambio
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "El complemento ya estaba integrado."
            exit 0
          fi
          git config user.name "televerso-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Integrar actividades de Lenguajes en la plataforma [skip ci]"
          git push
