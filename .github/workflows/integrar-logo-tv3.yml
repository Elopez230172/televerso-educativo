name: Integrar logo TeleVerso propuesta 3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrar-logo-tv3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrar identidad visual
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Título y favicon
          s=s.replace('<title>PORTAL EDUCATIVO TELESECUNDARIA</title>', '<title>TeleVerso Educativo</title>\n    <link rel="icon" type="image/svg+xml" href="televerso-logo.svg">')

          # Estilos de marca
          if '.tv-logo-brand' not in s:
              css='''\n        .tv-logo-brand{object-fit:contain;filter:drop-shadow(0 0 14px rgba(56,189,248,.28));transition:transform .3s ease,filter .3s ease}\n        .tv-logo-brand:hover{transform:translateY(-2px) scale(1.02);filter:drop-shadow(0 0 20px rgba(129,140,248,.48))}\n        .tv-logo-shell{position:relative;border-radius:24px;background:radial-gradient(circle at 50% 42%,rgba(56,189,248,.12),rgba(15,23,42,.08) 60%,transparent 78%);box-shadow:inset 0 0 0 1px rgba(129,140,248,.10)}\n'''
              s=s.replace('        @media print {', css+'\n        @media print {',1)

          # Barra superior con nueva identidad
          old='''        <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateHome()">\n            <span class="font-extrabold text-sm sm:text-base tracking-tight text-white block">PORTAL EDUCATIVO TELESECUNDARIA</span>\n        </div>'''
          new='''        <div class="flex items-center gap-3 cursor-pointer min-w-0" onclick="navigateHome()">\n            <img src="televerso-logo.svg" alt="TeleVerso Educativo" class="tv-logo-brand w-28 sm:w-36 h-12 shrink-0">\n            <span class="hidden md:block text-[11px] text-indigo-200/90 font-semibold border-l border-indigo-400/20 pl-3">Plataforma interactiva para Telesecundaria</span>\n        </div>'''
          if old in s: s=s.replace(old,new,1)

          # Portada: sustituir logo anterior y ajustar dimensiones
          s=s.replace('<img src="Logo.jpg" alt="Logotipo Telesecundaria" class="w-32 h-32 sm:w-36 sm:h-36 object-cover rounded-2xl border-2 border-purple-500/50 shadow-2xl shrink-0 bg-slate-800">', '<img src="televerso-logo.svg" alt="TeleVerso Educativo" class="tv-logo-brand w-64 sm:w-80 h-auto shrink-0">',1)

          # Panel docente: sustituir logo estático anterior
          s=s.replace('<img src="Logo.jpg" alt="Logo de TeleVerso Educativo" class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl object-cover border border-indigo-400/40 shadow-lg shadow-indigo-600/20 shrink-0 bg-slate-800">', '<img src="televerso-logo.svg" alt="TeleVerso Educativo" class="tv-logo-brand w-28 sm:w-36 h-16 shrink-0">',1)

          # Expediente del alumno: agregar logo al encabezado
          stats_old='''            <div class="flex justify-between items-center pb-4 border-b border-white/10 mb-4">\n                <div>\n                    <h4 id="stats-student-name" class="text-2xl font-black text-white">Expediente del Alumno</h4>'''
          stats_new='''            <div class="flex justify-between items-center pb-4 border-b border-white/10 mb-4 gap-4">\n                <div class="flex items-center gap-4 min-w-0">\n                    <img src="televerso-logo.svg" alt="TeleVerso Educativo" class="tv-logo-brand w-28 sm:w-36 h-16 shrink-0">\n                    <div>\n                    <div class="text-[10px] uppercase tracking-[.18em] text-indigo-300 font-black mb-1">Expediente académico</div>\n                    <h4 id="stats-student-name" class="text-2xl font-black text-white">Expediente del Alumno</h4>'''
          if stats_old in s:
              s=s.replace(stats_old,stats_new,1)
              s=s.replace('                    <p id="stats-student-meta" class="text-xs text-indigo-300 font-mono mt-0.5">Grupo | ID</p>\n                </div>\n                <button onclick="closeStatsModal()"', '                    <p id="stats-student-meta" class="text-xs text-indigo-300 font-mono mt-0.5">Grupo | ID</p>\n                    </div>\n                </div>\n                <button onclick="closeStatsModal()"',1)

          # Modal QR individual: logo visible
          qr_old='''        <div class="glass-panel w-full max-w-sm rounded-3xl p-6 text-center border border-white/20">\n            <h4 id="qr-modal-title" class="text-xl font-bold text-white mb-1">Credencial QR</h4>'''
          qr_new='''        <div class="glass-panel w-full max-w-sm rounded-3xl p-6 text-center border border-white/20">\n            <img src="televerso-logo.svg" alt="TeleVerso Educativo" class="tv-logo-brand w-44 h-auto mx-auto mb-3">\n            <h4 id="qr-modal-title" class="text-xl font-bold text-white mb-1">Credencial QR</h4>'''
          if qr_old in s: s=s.replace(qr_old,qr_new,1)

          # Modal QR principal: logo visible
          mainqr_old='''        <div class="glass-panel w-full max-w-sm rounded-3xl p-6 text-center border border-white/20">\n            <h4 class="text-xl font-bold text-white mb-1">QR del Portal Principal</h4>'''
          mainqr_new='''        <div class="glass-panel w-full max-w-sm rounded-3xl p-6 text-center border border-white/20">\n            <img src="televerso-logo.svg" alt="TeleVerso Educativo" class="tv-logo-brand w-44 h-auto mx-auto mb-3">\n            <h4 class="text-xl font-bold text-white mb-1">QR del Portal Principal</h4>'''
          if mainqr_old in s: s=s.replace(mainqr_old,mainqr_new,1)

          # Reutilizar las llamadas existentes al viejo diamante para mostrar el nuevo logo animado.
          pattern=r'''function createTeleversoDiamond\(containerId, size = 160\) \{.*?\n        \}\n\n        // =========================================================================\n        // ESCÁNER DE CÁMARA QR'''
          replacement='''function createTeleversoDiamond(containerId, size = 160) {\n            const container = document.getElementById(containerId);\n            if (!container) return;\n            container.innerHTML = '';\n            container.classList.add('tv-logo-shell','flex','items-center','justify-center');\n            const img = document.createElement('img');\n            img.src = 'televerso-logo.svg';\n            img.alt = 'TeleVerso Educativo';\n            img.className = 'tv-logo-brand';\n            img.style.width = Math.max(96, size * 1.35) + 'px';\n            img.style.height = Math.max(58, size * 0.72) + 'px';\n            container.appendChild(img);\n        }\n\n        // =========================================================================\n        // ESCÁNER DE CÁMARA QR'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n: s=s2

          # Credencial individual impresa: logo
          s=s.replace('<h3 style="margin: 0; font-size: 16px; font-weight: 800; color: #1e293b;">TeleVerso Educativo</h3>', '<img src="televerso-logo.svg" alt="TeleVerso Educativo" style="display:block;width:190px;height:auto;margin:0 auto 6px auto;"><h3 style="margin: 0; font-size: 16px; font-weight: 800; color: #1e293b;">TeleVerso Educativo</h3>',1)

          # Impresión QR principal
          s=s.replace('<h3 style="margin: 0; font-size: 18px; font-weight: 800; color: #1e293b;">TeleVerso Educativo</h3>', '<img src="televerso-logo.svg" alt="TeleVerso Educativo" style="display:block;width:210px;height:auto;margin:0 auto 8px auto;"><h3 style="margin: 0; font-size: 18px; font-weight: 800; color: #1e293b;">TeleVerso Educativo</h3>',1)

          # Encabezado de impresión de grupo
          s=s.replace('<h2 style="margin: 0; font-size: 20px; font-weight: 900; color: #0f172a;">TeleVerso Educativo · Credenciales Escolares</h2>', '<img src="televerso-logo.svg" alt="TeleVerso Educativo" style="display:block;width:240px;height:auto;margin:0 auto 8px auto;"><h2 style="margin: 0; font-size: 20px; font-weight: 900; color: #0f172a;">TeleVerso Educativo · Credenciales Escolares</h2>',1)

          # Cada credencial de grupo recibe emblema compacto
          s=s.replace('<span style="font-size: 9px; font-weight: 800; color: #6366f1; text-transform: uppercase; display: block;">TeleVerso Educativo</span>', '<img src="televerso-logo.svg" alt="TeleVerso Educativo" style="display:block;width:120px;height:auto;margin:0 auto 4px auto;"><span style="font-size: 9px; font-weight: 800; color: #6366f1; text-transform: uppercase; display: block;">TeleVerso Educativo</span>',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar cambios
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "La identidad visual ya estaba integrada."
            exit 0
          fi
          git config user.name "televerso-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Integrar logo TV3 en alumnos, expedientes y credenciales [skip ci]"
          git push
