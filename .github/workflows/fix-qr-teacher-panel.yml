name: Corregir QR y panel docente

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-qr-teacher-panel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Corregir QR y encabezado docente
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Corregir apertura del modal QR individual.
          old_qr = "document.getElementById('modal-qr').classList.add('hidden');\n\n            setTimeout(() => {\n                new QRCode(container, {"
          new_qr = "document.getElementById('modal-qr').classList.remove('hidden');\n\n            setTimeout(() => {\n                new QRCode(container, {"
          if old_qr in s:
              s = s.replace(old_qr, new_qr, 1)
          elif "document.getElementById('modal-qr').classList.remove('hidden');" not in s:
              raise SystemExit('No se encontró el bloque esperado del QR individual.')

          # 2) Agregar nombre de la página y logo al encabezado del panel docente.
          old_header = '''            <div class="flex justify-between items-center pb-4 border-b border-white/10 mb-6">
                <div>
                    <h3 class="text-2xl font-black text-white flex items-center space-x-2">
                        <i class="fa-solid fa-chalkboard-user text-indigo-400"></i>
                        <span>Panel Docente · Control en la Nube</span>
                    </h3>
                    <p class="text-slate-400 text-xs mt-0.5">Gestión de grupos, eliminación, expedientes detallados e impresión</p>
                </div>
                <button onclick="closeTeacherModal()" class="text-slate-400 hover:text-white text-2xl"><i class="fa-solid fa-xmark"></i></button>
            </div>'''

          new_header = '''            <div class="flex justify-between items-center pb-4 border-b border-white/10 mb-6 gap-4">
                <div class="flex items-center gap-4 min-w-0">
                    <img src="Logo.jpg" alt="Logo de TeleVerso Educativo" class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl object-cover border border-indigo-400/40 shadow-lg shadow-indigo-600/20 shrink-0 bg-slate-800">
                    <div class="min-w-0">
                        <div class="text-indigo-300 text-[11px] sm:text-xs font-black uppercase tracking-[0.16em] mb-1">TeleVerso Educativo</div>
                        <h3 class="text-xl sm:text-2xl font-black text-white flex items-center gap-2 leading-tight">
                            <i class="fa-solid fa-chalkboard-user text-indigo-400"></i>
                            <span>Panel Docente · Control en la Nube</span>
                        </h3>
                        <p class="text-slate-400 text-xs mt-1">Gestión de grupos, expedientes, códigos QR, impresión y seguimiento de actividades.</p>
                    </div>
                </div>
                <button onclick="closeTeacherModal()" aria-label="Cerrar panel docente" class="text-slate-400 hover:text-white text-2xl shrink-0"><i class="fa-solid fa-xmark"></i></button>
            </div>'''

          if old_header in s:
              s = s.replace(old_header, new_header, 1)
          elif 'Logo de TeleVerso Educativo' not in s:
              raise SystemExit('No se encontró el encabezado esperado del panel docente.')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Publicar correcciones
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Las correcciones ya estaban aplicadas."
            exit 0
          fi
          git config user.name "televerso-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Corregir QR de alumnos y encabezado del panel docente [skip ci]"
          git push
