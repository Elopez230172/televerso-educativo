name: Ajustar panel docente y Lenguajes avanzado

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-qr-teacher-panel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajustes de interfaz y actividades
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'id="logo-3d-teacher" class="'
          if marker in s and 'id="logo-3d-teacher" class="order-last ' not in s:
              s = s.replace(marker, 'id="logo-3d-teacher" class="order-last ', 1)
          tag = '    <script src="lenguajes-avanzado.js"></script>\n'
          if 'src="lenguajes-avanzado.js"' not in s:
              base = '    <script src="lenguajes-addon.js"></script>\n'
              if base in s:
                  s = s.replace(base, base + tag, 1)
              else:
                  s = s.replace('</body>', tag + '</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Guardar cambios
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "televerso-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Mover diamante y activar banco avanzado [skip ci]"
          git push
