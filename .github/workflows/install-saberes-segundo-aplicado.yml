name: Instalar refuerzo Saberes 2
on:
  push:
    paths:
      - 'saberes-segundo-aplicado.js'
      - '.github/workflows/install-saberes-segundo-aplicado.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insertar modulo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='    <script src="saberes-segundo-aplicado.js"></script>\n'
          anchor='    <script src="saberes-segundo.js"></script>\n'
          if tag not in s:
              if anchor not in s:
                  raise SystemExit('No se encontro saberes-segundo.js en index.html')
              s=s.replace(anchor, anchor+tag, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Publicar cambio
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'televerso-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Integrar misiones de lectura aplicadas de Saberes 2 [skip ci]'
          git push
