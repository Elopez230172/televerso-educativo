name: Instalar refuerzo Saberes 2
on:
  push:
    paths:
      - 'saberes-segundo-aplicado.js'
      - 'saberes-segundo-bloque1.js'
      - '.github/workflows/install-saberes-segundo-aplicado.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insertar modulos
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          applied='    <script src="saberes-segundo-aplicado.js"></script>\n'
          block='    <script src="saberes-segundo-bloque1.js"></script>\n'
          base='    <script src="saberes-segundo.js"></script>\n'
          access='    <script src="acceso-por-grado.js"></script>\n'
          if applied not in s:
              if base not in s:
                  raise SystemExit('No se encontro saberes-segundo.js en index.html')
              s=s.replace(base, base+applied, 1)
          if block not in s:
              if applied in s:
                  s=s.replace(applied, applied+block, 1)
              elif access in s:
                  s=s.replace(access, block+access, 1)
              else:
                  raise SystemExit('No se encontro punto de insercion para Bloque 1')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Publicar cambio
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'televerso-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Organizar Saberes 2 en Bloque 1 [skip ci]'
          git push
