name: Integrar corrección móvil V2
on:
  push:
    paths:
      - 'movil-estable-v2.js'
      - '.github/workflows/install-movil-estable-v2.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript
        run: node --check movil-estable-v2.js
      - name: Sustituir corrección móvil anterior
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='    <script src="estabilidad-movil.js"></script>\n'
          new='    <script src="movil-estable-v2.js"></script>\n'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              anchor='    <script src="qr-premium.js"></script>\n'
              if anchor not in s:
                  raise SystemExit('No se encontró el punto de inserción en index.html')
              s=s.replace(anchor,new+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar y retirar instalador
        run: |
          rm .github/workflows/install-movil-estable-v2.yml
          git config user.name 'televerso-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/install-movil-estable-v2.yml
          git commit -m 'Publicar corrección móvil V2 [skip ci]'
          git push
