name: Corregir brinco móvil V3
on:
  push:
    paths:
      - 'movil-estable-v3.js'
      - '.github/workflows/corregir-brinco-movil-v3.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Eliminar observadores globales que reescriben la interfaz
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              'navegacion-curricular.js',
              'navegacion-progresiva.js',
              'modo-retos.js',
              'saberes2-retos-directos.js',
          ]

          pat = re.compile(
              r'\n\s*const observer\s*=\s*new MutationObserver\(\s*\(\)\s*=>\s*\{.*?\}\s*\);\s*\n\s*observer\.observe\(document\.documentElement,\s*\{.*?childList\s*:\s*true.*?subtree\s*:\s*true.*?\}\s*\);\s*\n',
              re.S,
          )

          for name in files:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s2, n = pat.subn('\n', s, count=1)
              if n != 1:
                  raise SystemExit(f'No se encontró exactamente un observador global en {name}; encontrados: {n}')
              p.write_text(s2, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<script src="movil-estable-v2.js"></script>'
          new = '<script src="movil-estable-v3.js"></script>'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('No se encontró movil-estable-v2.js en index.html')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar JavaScript
        run: |
          node --check navegacion-curricular.js
          node --check navegacion-progresiva.js
          node --check modo-retos.js
          node --check saberes2-retos-directos.js
          node --check movil-estable-v3.js
          ! grep -q 'new MutationObserver' navegacion-curricular.js
          ! grep -q 'new MutationObserver' navegacion-progresiva.js
          ! grep -q 'new MutationObserver' modo-retos.js
          ! grep -q 'new MutationObserver' saberes2-retos-directos.js
          grep -q 'movil-estable-v3.js' index.html
          ! grep -q 'movil-estable-v2.js' index.html
      - name: Publicar y retirar instalador
        run: |
          rm .github/workflows/corregir-brinco-movil-v3.yml
          git config user.name 'televerso-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html navegacion-curricular.js navegacion-progresiva.js modo-retos.js saberes2-retos-directos.js movil-estable-v3.js .github/workflows/corregir-brinco-movil-v3.yml
          git commit -m 'Eliminar re-render continuo y estabilizar scroll móvil [skip ci]'
          git push
