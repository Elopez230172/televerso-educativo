name: Agregar logo de Telesecundaria

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agregar-logo-telesecundaria.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Colocar logo institucional
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if '.telesec-logo-card' not in s:
              css = "\n        .telesec-logo-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.45rem;padding:.65rem;border-radius:1.4rem;background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(15,23,42,.25));border:1px solid rgba(255,255,255,.13);box-shadow:0 14px 34px rgba(2,6,23,.34),0 0 28px rgba(56,189,248,.08);backdrop-filter:blur(12px)}\n        .telesec-logo-img{width:100%;height:100%;object-fit:cover;border-radius:1rem;filter:drop-shadow(0 0 14px rgba(255,255,255,.08));transition:transform .3s ease,filter .3s ease}\n        .telesec-logo-card:hover .telesec-logo-img{transform:scale(1.035);filter:drop-shadow(0 0 18px rgba(129,140,248,.24))}\n        .telesec-logo-label{font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#cbd5e1;white-space:nowrap}\n"
              s = s.replace('        @media print {', css + '\n        @media print {', 1)

          home_old = "                <!-- IDENTIDAD PRINCIPAL: un solo logo grande y centrado -->\n                <div class=\"flex items-center justify-center py-3 sm:py-7\">\n                    <img src=\"televerso-logo.svg\" alt=\"TeleVerso Educativo\" class=\"tv-home-logo-feature mx-auto\">\n                </div>"
          home_new = "                <!-- IDENTIDAD PRINCIPAL -->\n                <div class=\"relative flex flex-col sm:block items-center justify-center py-3 sm:py-7 min-h-[300px] sm:min-h-[360px]\">\n                    <div class=\"flex items-center justify-center h-full\">\n                        <img src=\"televerso-logo.svg\" alt=\"TeleVerso Educativo\" class=\"tv-home-logo-feature mx-auto sm:max-w-[78%] lg:max-w-[76%]\">\n                    </div>\n                    <div class=\"telesec-logo-card mt-5 sm:mt-0 sm:absolute sm:right-3 lg:right-6 sm:top-1/2 sm:-translate-y-1/2 w-28 h-auto sm:w-32 lg:w-36 z-10\">\n                        <img src=\"Logo.jpg\" alt=\"Logo de Telesecundaria\" class=\"telesec-logo-img aspect-square\">\n                        <span class=\"telesec-logo-label\">Telesecundaria</span>\n                    </div>\n                </div>"
          if home_old in s:
              s = s.replace(home_old, home_new, 1)
          elif 'telesec-logo-label">Telesecundaria</span>' not in s:
              raise SystemExit('No se encontró el bloque principal esperado.')

          teacher_old = "      </div>\n      <button onclick=\"closeTeacherModal()\" aria-label=\"Cerrar panel docente\" class=\"text-slate-400 hover:text-white text-2xl shrink-0\"><i class=\"fa-solid fa-xmark\"></i></button>\n  </div>"
          teacher_new = "      </div>\n      <div class=\"flex items-center gap-3 sm:gap-4 shrink-0\">\n          <div class=\"telesec-logo-card w-16 sm:w-20 lg:w-24 p-2\">\n              <img src=\"Logo.jpg\" alt=\"Logo de Telesecundaria\" class=\"telesec-logo-img aspect-square\">\n              <span class=\"telesec-logo-label hidden sm:block\">Telesecundaria</span>\n          </div>\n          <button onclick=\"closeTeacherModal()\" aria-label=\"Cerrar panel docente\" class=\"text-slate-400 hover:text-white text-2xl shrink-0\"><i class=\"fa-solid fa-xmark\"></i></button>\n      </div>\n  </div>"
          panel_start = s.find('<!-- PANEL DOCENTE -->')
          panel_end = s.find('<!-- MODAL DE EXPEDIENTE')
          panel = s[panel_start:panel_end]
          if teacher_old in panel:
              panel = panel.replace(teacher_old, teacher_new, 1)
              s = s[:panel_start] + panel + s[panel_end:]
          elif 'alt="Logo de Telesecundaria"' not in panel:
              raise SystemExit('No se encontró el encabezado docente esperado.')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Publicar cambios
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Los logos ya estaban colocados."
            exit 0
          fi
          git config user.name "televerso-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Agregar logo de Telesecundaria en portada y panel docente [skip ci]"
          git push
