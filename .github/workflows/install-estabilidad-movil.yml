name: Integrar estabilidad móvil
on:
  push:
    paths:
      - 'estabilidad-movil.js'
      - '.github/workflows/install-estabilidad-movil.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript
        run: node --check estabilidad-movil.js
      - name: Insertar módulo de estabilidad
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          line='    <script src="estabilidad-movil.js"></script>\n'
          if line not in s:
              anchor='    <script src="qr-premium.js"></script>\n'
              if anchor not in s:
                  raise SystemExit('No se encontró qr-premium.js en index.html')
              s=s.replace(anchor,line+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar y retirar instalador
        run: |
          rm .github/workflows/install-estabilidad-movil.yml
          git config user.name 'televerso-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/install-estabilidad-movil.yml
          git commit -m 'Publicar ajuste de estabilidad móvil [skip ci]'
          git push
