name: Restaurar Lenguajes al estado anterior

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restaurar-lenguajes-tercero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revertir únicamente la última edición de Lenguajes 3.º
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('    <script src="lenguajes-juegos-variedad.js"></script>\n','')
          s=s.replace('<script src="lenguajes-juegos-variedad.js"></script>\n','')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f lenguajes-juegos-variedad.js
          rm -f .github/workflows/install-lenguajes-juegos.yml
          rm -f .github/workflows/restaurar-lenguajes-tercero.yml
      - name: Publicar restauración
        run: |
          git config user.name "televerso-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No había cambios que restaurar."
            exit 0
          fi
          git commit -m "Restaurar Lenguajes 3.º al estado previo [skip ci]"
          git push
