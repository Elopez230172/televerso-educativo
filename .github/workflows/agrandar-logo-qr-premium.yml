name: Verificar QR premium

on:
  push:
    branches: [ main ]
    paths:
      - 'qr-premium.js'
      - '.github/workflows/agrandar-logo-qr-premium.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-qr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar diseño premium y equivalencia de impresión
        run: |
          grep -F "Math.round(size*.46)" qr-premium.js
          grep -F "background:rgba(255,255,255,.92)" qr-premium.js
          grep -F "backdrop-filter:blur(10px)" qr-premium.js
          grep -F "function groupStudentCard" qr-premium.js
          grep -F "renderQr(document.getElementById(\`print-qr-\${st.id}\`),\`${base}?s=\${encodeURIComponent(st.id)}\`,176)" qr-premium.js
          echo 'QR individual y QR grupal usan el mismo tamaño y estilo premium.'
