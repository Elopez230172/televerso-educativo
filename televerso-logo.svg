<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">TeleVerso Educativo</title>
  <desc id="desc">Emblema TV con libro, señal y geometría orbital animada.</desc>
  <defs>
    <linearGradient id="tGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/><stop offset=".32" stop-color="#67e8f9"/><stop offset=".68" stop-color="#3b82f6"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".38" stop-color="#bfdbfe"/><stop offset=".7" stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/><stop offset=".45" stop-color="#dbeafe"/><stop offset=".65" stop-color="#38bdf8"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#172554" stop-opacity=".72"/><stop offset=".58" stop-color="#0f172a" stop-opacity=".38"/><stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect x="0" y="0" width="720" height="360" rx="42" fill="url(#bgGrad)"/>

  <g transform="translate(42 24)">
    <g transform="translate(150 155)" opacity=".58">
      <polygon points="0,-118 108,-38 82,100 -82,100 -108,-38" fill="#312e81" fill-opacity=".15" stroke="#818cf8" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="0,-100 92,-30 68,82 -68,82 -92,-30" fill="none" stroke="#22d3ee" stroke-opacity=".35" stroke-width="1.6">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="34s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <g transform="translate(150 155) rotate(-10)" fill="none" stroke-linecap="round">
      <ellipse rx="135" ry="48" stroke="#38bdf8" stroke-width="3" stroke-opacity=".7" stroke-dasharray="28 12" filter="url(#glow)">
        <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="7s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="118" ry="38" stroke="#a855f7" stroke-width="2" stroke-opacity=".5" stroke-dasharray="20 16">
        <animate attributeName="stroke-dashoffset" from="0" to="140" dur="9s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <g filter="url(#glow)">
      <path d="M69 86 H231 L218 113 H172 V226 H128 V113 H81 Z" fill="url(#tGrad)" stroke="#e0f2fe" stroke-opacity=".65" stroke-width="2"/>
      <path d="M161 121 C187 139 208 164 220 202 C232 168 258 140 290 123 C277 171 254 215 221 242 C193 216 174 177 161 121 Z" fill="url(#vGrad)" stroke="#e0f2fe" stroke-opacity=".72" stroke-width="2"/>
      <path d="M220 202 C237 171 255 153 276 141" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-opacity=".55"/>
      <path d="M220 202 C204 172 189 152 174 140" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-opacity=".5"/>
    </g>

    <g transform="translate(150 48)" fill="none" stroke-linecap="round" filter="url(#glow)">
      <circle r="10" fill="#67e8f9" stroke="#e0f2fe" stroke-width="2">
        <animate attributeName="r" values="9;12;9" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <path d="M-28 7 A34 34 0 0 1 28 7" stroke="#38bdf8" stroke-width="5">
        <animate attributeName="stroke-opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/>
      </path>
      <path d="M-48 14 A55 55 0 0 1 48 14" stroke="#818cf8" stroke-width="5">
        <animate attributeName="stroke-opacity" values="1;.3;1" dur="2.8s" repeatCount="indefinite"/>
      </path>
    </g>

    <circle cx="38" cy="182" r="5" fill="#22d3ee" filter="url(#glow)"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="285" cy="84" r="4" fill="#c084fc" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(330 126)">
    <text x="0" y="42" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" fill="url(#textGrad)" letter-spacing="-3">TeleVerso</text>
    <text x="7" y="82" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#e2e8f0" letter-spacing="11">EDUCATIVO</text>
    <text x="8" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#93c5fd" letter-spacing="4">APRENDER · CONECTAR · TRANSFORMAR</text>
  </g>
</svg>